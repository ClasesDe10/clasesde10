<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — ClasesDe10</title>
<meta name="description" content="Accede a tu cuenta de ClasesDe10. Plataforma para familias, profesores y alumnos de clases particulares en Madrid.">
<link rel="canonical" href="https://clasesde10.com/pages/login.html">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1f3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClasesDe10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/assets/img/logo-192.png">
<link rel="icon" type="image/png" href="/assets/img/logo-192.png">
<link rel="stylesheet" href="../css/dashboard.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
       background: linear-gradient(135deg, var(--navy) 0%, #0d2952 55%, #0e3a5a 100%); }
.auth-card {
  background: var(--white); border-radius: var(--radius);
  padding: 44px; width:100%; max-width:420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
.auth-logo { text-align:center; margin-bottom:32px; }
.auth-logo img { width:64px;height:64px;border-radius:14px;object-fit:cover; }
.auth-logo-name {
  font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:900;
  color:var(--navy); margin-top:10px;
}
.auth-logo-name span { color:var(--gold); }
.auth-subtitle { font-size:.875rem; color:var(--gray-mid); margin-top:4px; }
.auth-title { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700;
               color:var(--navy); margin-bottom:24px; }
.auth-sep { text-align:center; color:var(--gray-mid); font-size:.78rem; margin:16px 0;
            position:relative; }
.auth-sep::before, .auth-sep::after {
  content:''; position:absolute; top:50%; width:40%; height:1px; background:rgba(0,0,0,0.1); }
.auth-sep::before { left:0; }
.auth-sep::after { right:0; }
.auth-footer { text-align:center; margin-top:20px; font-size:.82rem; color:var(--gray-mid); }
.auth-footer a { color:var(--navy); font-weight:600; text-decoration:none; }
.auth-footer a:hover { color:var(--gold); }
.forgot-link { text-align:right; margin-top:-10px; margin-bottom:14px; }
.forgot-link a { font-size:.78rem; color:var(--gray-mid); text-decoration:none; }
.forgot-link a:hover { color:var(--navy); }
.error-banner {
  background:rgba(220,38,38,.07); border:1px solid rgba(220,38,38,.2);
  border-radius:var(--radius-sm); padding:10px 14px;
  color:var(--danger); font-size:.82rem; margin-bottom:16px; display:none;
}
.tab-btns { display:flex; gap:8px; margin-bottom:24px; }
.tab-btn {
  flex:1; padding:9px; border-radius:var(--radius-sm);
  border:1.5px solid rgba(0,0,0,0.13); background:none;
  font-family:inherit; font-size:.82rem; font-weight:600;
  cursor:pointer; color:var(--gray-mid); transition:all .18s;
}
.tab-btn.active { background:var(--navy); color:white; border-color:var(--navy); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <img src="/assets/img/logo-192.png" alt="ClasesDe10">
    <div class="auth-logo-name">Clases<span>De10</span></div>
    <div class="auth-subtitle">Tu academia de confianza en Madrid</div>
  </div>
  <h1 class="sr-only">Iniciar sesión en ClasesDe10</h1>

  <div id="error-banner" class="error-banner" role="alert" aria-live="assertive"></div>

  <div class="tab-btns" role="tablist" aria-label="Acceso a ClasesDe10">
    <button type="button" role="tab" class="tab-btn active" id="tab-login" aria-controls="form-login" aria-selected="true">Iniciar sesión</button>
    <button type="button" role="tab" class="tab-btn" id="tab-forgot" aria-controls="form-forgot" aria-selected="false">Recuperar acceso</button>
  </div>

  <!-- FORMULARIO LOGIN -->
  <form id="form-login" method="post" role="tabpanel" aria-labelledby="tab-login" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Correo electrónico <span class="required">*</span></label>
      <input class="form-control" type="email" id="email" name="email"
             placeholder="tu@email.com" autocomplete="email" maxlength="254" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Contraseña <span class="required">*</span></label>
      <input class="form-control" type="password" id="password" name="password"
             placeholder="••••••••" autocomplete="current-password" maxlength="128" required>
    </div>
    <div class="forgot-link">
      <a href="#" id="go-forgot">¿Olvidaste tu contraseña?</a>
    </div>
    <button type="submit" class="btn btn-primary btn-lg" id="btn-login" style="width:100%;justify-content:center">
      <span id="btn-login-text">Entrar a mi cuenta</span>
      <span id="btn-login-loading" style="display:none">Cargando…</span>
    </button>
  </form>

  <!-- FORMULARIO RECUPERAR -->
  <form id="form-forgot" method="post" role="tabpanel" aria-labelledby="tab-forgot" style="display:none" novalidate>
    <p style="font-size:.875rem;color:var(--gray-mid);margin-bottom:16px">
      Introduce tu email y te enviaremos un enlace para restablecer tu contraseña.
    </p>
    <div class="form-group">
      <label class="form-label" for="email-forgot">Correo electrónico <span class="required">*</span></label>
      <input class="form-control" type="email" id="email-forgot" name="email" placeholder="tu@email.com" autocomplete="email" maxlength="254" required>
    </div>
    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">
      Enviar enlace de recuperación
    </button>
  </form>

  <div class="auth-sep">o</div>
  <div class="auth-footer">
    ¿Aún no tienes cuenta?
    <a href="registro.html">Regístrate gratis</a>
  </div>
  <div class="auth-footer" style="margin-top:8px">
    <a href="/">← Volver a la web</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
import { login, resetPassword, redirectByRole, getSession, getUsuarioActual } from '../js/auth-provider.js';
import db from '../js/supabase-client.js';
import { showToast } from '../js/utils.js';
import { trackLogin } from '../js/analytics.js';

const errorBanner = document.getElementById('error-banner');
const formLogin   = document.getElementById('form-login');
const formForgot  = document.getElementById('form-forgot');
const tabLogin    = document.getElementById('tab-login');
const tabForgot   = document.getElementById('tab-forgot');
const goForgot    = document.getElementById('go-forgot');

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.style.display = 'block';
}
function hideError() {
  errorBanner.style.display = 'none';
}

function setTab(tab) {
  if (tab === 'login') {
    formLogin.style.display = '';
    formForgot.style.display = 'none';
    tabLogin.classList.add('active');
    tabForgot.classList.remove('active');
    tabLogin.setAttribute('aria-selected', 'true');
    tabForgot.setAttribute('aria-selected', 'false');
  } else {
    formLogin.style.display = 'none';
    formForgot.style.display = '';
    tabLogin.classList.remove('active');
    tabForgot.classList.add('active');
    tabLogin.setAttribute('aria-selected', 'false');
    tabForgot.setAttribute('aria-selected', 'true');
  }
  hideError();
}

tabLogin.addEventListener('click', () => setTab('login'));
tabForgot.addEventListener('click', () => setTab('forgot'));
goForgot.addEventListener('click', (e) => { e.preventDefault(); setTab('forgot'); });

formLogin.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btnText  = document.getElementById('btn-login-text');
  const btnLoad  = document.getElementById('btn-login-loading');
  const btn      = document.getElementById('btn-login');

  btnText.style.display = 'none';
  btnLoad.style.display = '';
  btn.disabled = true;

  const { error, usuario } = await login(email, password);

  if (error) {
    const msg = error.message === 'Invalid login credentials'
      ? 'Email o contraseña incorrectos.'
      : error.message;
    showError(msg);
    btnText.style.display = '';
    btnLoad.style.display = 'none';
    btn.disabled = false;
    return;
  }

  trackLogin(usuario.rol);
  redirectByRole(usuario.rol);
});

formForgot.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const email = document.getElementById('email-forgot').value.trim();
  if (!email) { showError('Introduce tu correo electrónico.'); return; }

  const { error } = await resetPassword(email);
  if (error) { showError(error.message); return; }

  showToast('Email enviado', 'Revisa tu bandeja de entrada.', 'success');
  setTab('login');
});

// ── Redirigir si ya hay sesión activa ───────────────────────────
// Cubre: usuario ya logado que visita /login, y confirmación de email
// con flujo PKCE donde el SDK intercambia el código antes de llegar aquí.
const _sesionActual = await getSession();
if (_sesionActual) {
  const _usuarioActual = await getUsuarioActual();
  if (_usuarioActual?.activo) redirectByRole(_usuarioActual.rol);
}

// Cubre el caso donde el intercambio PKCE termina DESPUÉS de getSession()
// (URL tiene ?code= de la confirmación de email)
if (new URLSearchParams(location.search).has('code')) {
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      const u = await getUsuarioActual();
      if (u?.activo) redirectByRole(u.rol);
    }
  });
}
</script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
