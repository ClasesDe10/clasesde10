<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Alumno — ClasesDe10</title>
<meta name="description" content="Panel privado de alumno de ClasesDe10 para consultar clases, calendario y documentos.">
<link rel="canonical" href="https://clasesde10.com/pages/dashboard/alumno.html">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/assets/img/logo-192.png">
<link rel="stylesheet" href="../../css/dashboard.css?v=20260628-reputation-v2">
<meta name="theme-color" content="#0f1f3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClasesDe10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/assets/img/logo-192.png">
</head>
<body>
<div class="dash-layout">

  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-logo">
      <img src="/assets/img/logo-192.png" alt="ClasesDe10">
      <span class="sidebar-logo-text">Clases<span>De10</span></span>
    </a>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="user-avatar">A</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="user-nombre">Alumno</div>
        <div class="sidebar-user-role">Alumno</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-title">Mi panel</div>
      <button class="sidebar-link active" data-section="inicio">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Inicio
      </button>
      <button class="sidebar-link" data-section="calendario">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Mi calendario
      </button>
      <button class="sidebar-link" data-section="clases">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Mis clases
      </button>
      <button class="sidebar-link" data-section="profesor">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Mi profesor
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-logout" id="btn-logout">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main-content">
    <header class="topbar">
      <button class="hamburger-btn" id="hamburger"><span></span><span></span><span></span></button>
      <h1 class="topbar-title" id="topbar-title">Inicio</h1>
    </header>

    <div class="page-content">

      <!-- ══ INICIO ══ -->
      <section id="section-inicio" class="dash-section">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon navy">📅</div></div>
            <div class="stat-card-value" id="stat-proxima">—</div>
            <div class="stat-card-label">Próxima clase</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon teal">✓</div></div>
            <div class="stat-card-value" id="stat-realizadas-mes">—</div>
            <div class="stat-card-label">Clases este mes</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon gold">⏱</div></div>
            <div class="stat-card-value" id="stat-horas-mes">—</div>
            <div class="stat-card-label">Horas de estudio</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon green">👩‍🏫</div></div>
            <div class="stat-card-value" id="stat-profesores">—</div>
            <div class="stat-card-label">Profesores</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Próximas clases</span>
              <button class="btn btn-ghost btn-sm" data-section="clases">Ver todas</button>
            </div>
            <div class="card-body" style="padding:0" id="lista-proximas"></div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">Mi progreso</span></div>
            <div class="card-body" id="progreso-body">
              <div style="text-align:center;padding:20px">
                <div style="font-size:3rem;font-weight:900;color:var(--navy)" id="prog-total">0</div>
                <div style="font-size:.82rem;color:var(--gray-mid)">clases realizadas en total</div>
                <div style="margin-top:20px;height:8px;background:var(--gray-soft);border-radius:100px;overflow:hidden">
                  <div id="prog-bar" style="height:100%;background:var(--gold);border-radius:100px;width:0;transition:width .8s ease"></div>
                </div>
                <div style="font-size:.75rem;color:var(--gray-mid);margin-top:6px" id="prog-label"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ══ CALENDARIO ══ -->
      <section id="section-calendario" class="dash-section" style="display:none">
        <div style="display:grid;grid-template-columns:1fr 300px;gap:20px">
          <div id="calendario-wrapper"></div>
          <div class="card">
            <div class="card-header"><span class="card-title" id="cal-dia-titulo">Selecciona un día</span></div>
            <div class="card-body" style="padding:0" id="cal-clases-dia">
              <div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">Sin clases</div></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ══ MIS CLASES ══ -->
      <section id="section-clases" class="dash-section" style="display:none">
        <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
          <select class="form-control" id="filtro-estado" style="width:160px">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="programada">Programada legacy</option>
            <option value="realizada">Realizada</option>
            <option value="cancelada">Cancelada</option>
            <option value="reprogramada">Reprogramada</option>
            <option value="pagada">Pagada</option>
          </select>
          <input type="month" class="form-control" id="filtro-mes" style="width:160px">
        </div>
        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr><th>Fecha</th><th>Hora</th><th>Materia</th><th>Profesor</th><th>Duración</th><th>Estado</th><th>Notas del profesor</th></tr>
              </thead>
              <tbody id="tbody-clases"><tr><td colspan="7" style="text-align:center;padding:32px;color:var(--gray-mid)">Cargando…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ══ MI PROFESOR ══ -->
      <section id="section-profesor" class="dash-section" style="display:none">
        <div id="info-profesor">
          <div style="padding:40px;text-align:center;color:var(--gray-mid)">Cargando…</div>
        </div>
      </section>

    </div>
  </div>
</div>

<script type="module">
import db from '../../js/firebase-data-client.js?v=20260628-data-client';
import { requireAuth, logout } from '../../js/auth-provider.js?v=20260627-domain-auth';
import {
  showToast, initSidebar, formatFechaCorta, formatHora,
  badgeEstado, getIniciales, sanitize, fechaHoy
} from '../../js/utils.js';
import { Calendario } from '../../js/calendario.js';
import { classStatusForBadge, isScheduledClassStatus } from '../../js/calendar-engine.js?v=20260628-calendar';

const usuario = await requireAuth(['alumno']);
if (!usuario) throw new Error('No autorizado');

document.getElementById('user-nombre').textContent = `${usuario.nombre} ${usuario.apellidos}`;
document.getElementById('user-avatar').textContent = getIniciales(usuario.nombre, usuario.apellidos);

// Obtener registro alumno
const { data: alumnoData } = await db.from('alumnos').select('*').eq('usuario_id', usuario.id).single();
const alumnoId = alumnoData?.id;

// ── NAVEGACIÓN ───────────────────────────────────────────────────
const TITULOS = { inicio:'Mi panel', calendario:'Mi calendario', clases:'Mis clases', profesor:'Mi profesor' };

function irA(sec) {
  document.querySelectorAll('.dash-section').forEach(s => s.style.display = 'none');
  document.getElementById(`section-${sec}`).style.display = '';
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.toggle('active', l.dataset.section === sec));
  document.getElementById('topbar-title').textContent = TITULOS[sec] || sec;
  const loaders = { inicio: cargarInicio, calendario: iniciarCalendario, clases: cargarMisClases, profesor: cargarProfesor };
  loaders[sec]?.();
}
document.addEventListener('click', (e) => {
  const sectionTrigger = e.target.closest('[data-section]');
  if (!sectionTrigger) return;
  e.preventDefault();
  irA(sectionTrigger.dataset.section);
});
initSidebar();
document.getElementById('btn-logout').addEventListener('click', logout);

// ── INICIO ───────────────────────────────────────────────────────
async function cargarInicio() {
  if (!alumnoId) return;
  const hoy = fechaHoy();
  const mesInicio = hoy.substring(0,7) + '-01';

  const [{ data: proximaRaw }, { data: clasesMes }, { data: asig }, { data: total }] = await Promise.all([
    db.from('v_clases_completas').select('fecha,hora_inicio').eq('alumno_id', alumnoId)
      .gte('fecha', hoy).order('fecha').limit(10),
    db.from('clases').select('duracion_minutos,estado').eq('alumno_id', alumnoId).gte('fecha', mesInicio),
    db.from('asignaciones').select('profesor_id').eq('alumno_id', alumnoId).eq('activa', true),
    db.from('clases').select('id',{count:'exact',head:true}).eq('alumno_id', alumnoId).eq('estado','realizada'),
  ]);

  const proxima = (proximaRaw || []).filter((clase) => isScheduledClassStatus(clase.estado || clase.status)).slice(0, 1);
  document.getElementById('stat-proxima').textContent = proxima?.[0]
    ? `${formatFechaCorta(proxima[0].fecha)}`
    : 'Sin programar';

  const realizadas = (clasesMes||[]).filter(c => c.estado === 'realizada');
  document.getElementById('stat-realizadas-mes').textContent = realizadas.length;
  const horas = realizadas.reduce((s,c) => s + (c.duracion_minutos||0), 0);
  document.getElementById('stat-horas-mes').textContent = horas >= 60
    ? `${Math.floor(horas/60)}h ${horas%60}m`
    : `${horas} min`;
  document.getElementById('stat-profesores').textContent = [...new Set((asig||[]).map(a => a.profesor_id))].length;

  // Progreso
  const { count: totalClases } = await db.from('clases').select('id',{count:'exact',head:true}).eq('alumno_id', alumnoId).eq('estado','realizada');
  document.getElementById('prog-total').textContent = totalClases || 0;
  const meta = 50;
  const pct  = Math.min(100, Math.round(((totalClases||0) / meta) * 100));
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${pct}% hacia tu meta de ${meta} clases`;

  // Próximas
  const { data: proximasRaw } = await db.from('v_clases_completas')
    .select('*').eq('alumno_id', alumnoId).gte('fecha', hoy).order('fecha').limit(20);
  const proximas = (proximasRaw || [])
    .filter((clase) => isScheduledClassStatus(clase.estado || clase.status))
    .slice(0, 5);

  const cont = document.getElementById('lista-proximas');
  cont.innerHTML = proximas?.length ? proximas.map(c => `
    <div class="clase-item" style="padding:14px 20px">
      <div class="clase-time">
        <div class="clase-time-hora">${formatHora(c.hora_inicio)}</div>
        <div class="clase-time-min">${formatFechaCorta(c.fecha)}</div>
      </div>
      <div class="clase-info">
        <div class="clase-nombre">${sanitize(c.materia)}</div>
        <div class="clase-materia">con ${sanitize(c.profesor_nombre)} · ${c.duracion_minutos} min</div>
      </div>
      ${badgeEstado(classStatusForBadge(c))}
    </div>`).join('')
    : '<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">Sin clases próximas</div><div class="empty-desc">Habla con tu familia para solicitar clases.</div></div>';
}

// ── CALENDARIO ───────────────────────────────────────────────────
let cal;
async function iniciarCalendario() {
  if (!cal) {
    cal = new Calendario({
      contenedor: document.getElementById('calendario-wrapper'),
      onDiaClick: (fecha, clases) => {
        document.getElementById('cal-dia-titulo').textContent = formatFechaCorta(fecha) + ` (${clases.length})`;
        const cont = document.getElementById('cal-clases-dia');
        if (!clases.length) { cont.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">Sin clases</div></div>'; return; }
        cont.innerHTML = clases.map(c => `
          <div class="clase-item" style="padding:10px 16px">
            <div class="clase-time"><div class="clase-time-hora">${formatHora(c.hora_inicio||'')}</div></div>
            <div class="clase-info">
              <div class="clase-nombre">${sanitize(c.materia||'')}</div>
              <div class="clase-materia">${sanitize(c.profesor_nombre||'')}</div>
            </div>
            ${badgeEstado(classStatusForBadge(c))}
          </div>`).join('');
      },
      onMesChange: cargarClasesCalendario,
    });
  }
  await cargarClasesCalendario(cal.anio, cal.mes);
}

async function cargarClasesCalendario(anio, mes) {
  anio = anio ?? cal.anio; mes = mes ?? cal.mes;
  const desde = `${anio}-${String(mes+1).padStart(2,'0')}-01`;
  const hasta = `${anio}-${String(mes+1).padStart(2,'0')}-31`;
  const { data } = await db.from('v_clases_completas').select('fecha,estado,status,hora_inicio,materia,profesor_nombre,familyPaymentStatus,estado_pago')
    .eq('alumno_id', alumnoId).gte('fecha',desde).lte('fecha',hasta);
  cal.setClases(data||[]);
}

// ── MIS CLASES ───────────────────────────────────────────────────
async function cargarMisClases() {
  if (!alumnoId) return;
  const estado = document.getElementById('filtro-estado').value;
  const mes    = document.getElementById('filtro-mes').value;

  let q = db.from('v_clases_completas').select('*').eq('alumno_id', alumnoId);
  if (estado && estado !== 'confirmada') q = q.eq('estado', estado);
  if (mes) q = q.gte('fecha', mes+'-01').lte('fecha', mes+'-31');
  q = q.order('fecha', {ascending:false});

  const { data } = await q;
  const clases = estado === 'confirmada'
    ? (data || []).filter((clase) => classStatusForBadge(clase) === 'confirmada')
    : (data || []);
  const tbody = document.getElementById('tbody-clases');
  if (!clases.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--gray-mid)">Sin clases.</td></tr>'; return; }

  tbody.innerHTML = clases.map(c => `<tr>
    <td>${formatFechaCorta(c.fecha)}</td>
    <td>${formatHora(c.hora_inicio)}–${formatHora(c.hora_fin)}</td>
    <td><strong>${sanitize(c.materia)}</strong></td>
    <td>${sanitize(c.profesor_nombre)}</td>
    <td>${c.duracion_minutos} min</td>
    <td>${badgeEstado(classStatusForBadge(c))}</td>
    <td style="font-size:.78rem;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sanitize(c.notas_profesor||'—')}</td>
  </tr>`).join('');
}
['filtro-estado','filtro-mes'].forEach(id => document.getElementById(id).addEventListener('change', cargarMisClases));

// ── MI PROFESOR ──────────────────────────────────────────────────
async function cargarProfesor() {
  if (!alumnoId) return;
  const { data: asig } = await db.from('asignaciones')
    .select('materia, profesores(id, bio, materias, niveles_educativos, usuarios(nombre,apellidos,telefono,email))')
    .eq('alumno_id', alumnoId).eq('activa', true);

  const cont = document.getElementById('info-profesor');
  if (!asig?.length) {
    cont.innerHTML = `<div class="empty-state">
      <div class="empty-icon">👩‍🏫</div>
      <div class="empty-title">Sin profesor asignado</div>
      <div class="empty-desc">Tu familia puede solicitar un profesor desde su panel.</div>
    </div>`; return;
  }

  cont.innerHTML = asig.map(a => {
    const p = a.profesores;
    const u = p?.usuarios;
    return `
    <div class="card" style="max-width:600px;margin-bottom:20px">
      <div class="card-body">
        <div style="display:flex;gap:20px;align-items:flex-start;margin-bottom:20px">
          <div class="avatar" style="width:72px;height:72px;font-size:1.4rem;background:var(--navy);color:white;flex-shrink:0">
            ${getIniciales(u?.nombre, u?.apellidos)}
          </div>
          <div>
            <div style="font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--navy)">
              ${sanitize(u?.nombre||'')} ${sanitize(u?.apellidos||'')}
            </div>
            <div style="color:var(--gold);font-weight:600;margin-top:2px">${sanitize(a.materia)}</div>
            ${p?.bio ? `<p style="font-size:.875rem;color:var(--text-body);margin-top:10px;line-height:1.7">${sanitize(p.bio)}</p>` : ''}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:.875rem">
          <div>
            <div style="font-size:.72rem;font-weight:700;color:var(--gray-mid);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Contacto</div>
            <div>📞 ${sanitize(u?.telefono||'—')}</div>
            <div style="margin-top:4px">✉️ ${sanitize(u?.email||'—')}</div>
          </div>
          <div>
            <div style="font-size:.72rem;font-weight:700;color:var(--gray-mid);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Especialidades</div>
            <div>${(p?.materias||[]).map(m => `<span class="badge badge-navy" style="margin:2px">${sanitize(m)}</span>`).join('')||'—'}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── INIT ─────────────────────────────────────────────────────────
cargarInicio();
</script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
