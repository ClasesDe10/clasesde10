<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — ClasesDe10</title>
<meta name="description" content="Pantalla privada de ClasesDe10 para crear una nueva contrasena de acceso.">
<link rel="canonical" href="https://clasesde10.com/pages/reset-password.html">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1f3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClasesDe10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/assets/img/logo-192.png">
<link rel="icon" type="image/png" href="/assets/img/logo-192.png">
<link rel="stylesheet" href="../css/dashboard.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
     background:linear-gradient(135deg,var(--navy) 0%,#0d2952 55%,#0e3a5a 100%)}
.auth-card{background:var(--white);border-radius:var(--radius);padding:44px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.auth-logo-name{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:var(--navy);margin-top:8px}
.auth-logo-name span{color:var(--gold)}
.pwd-strength{height:4px;border-radius:2px;margin-top:6px;background:var(--gray-soft);overflow:hidden}
.pwd-strength-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
.error-banner{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius-sm);padding:10px 14px;color:var(--danger);font-size:.82rem;margin-bottom:16px;display:none}
.success-banner{background:rgba(22,163,74,.07);border:1px solid rgba(22,163,74,.25);border-radius:var(--radius-sm);padding:16px;color:var(--success);font-size:.875rem;margin-bottom:16px;text-align:center;display:none}
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <img src="/assets/img/logo-192.png" alt="ClasesDe10">
    <div class="auth-logo-name">Clases<span>De10</span></div>
  </div>

  <h1 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--navy);margin-bottom:6px">Nueva contraseña</h1>
  <p style="font-size:.875rem;color:var(--gray-mid);margin-bottom:20px">Introduce tu nueva contraseña. Debe tener al menos 8 caracteres.</p>

  <div id="error-banner" class="error-banner" role="alert" aria-live="assertive"></div>
  <div id="success-banner" class="success-banner" role="status" aria-live="polite">
    ✓ Contraseña actualizada correctamente.<br>
    <a href="login.html" style="color:var(--navy);font-weight:700">Iniciar sesión ahora →</a>
  </div>

  <form id="form-reset" method="post" novalidate>
    <div class="form-group">
      <label class="form-label" for="password">Nueva contraseña <span class="required">*</span></label>
      <input class="form-control" type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required minlength="8" maxlength="128">
      <div class="pwd-strength"><div class="pwd-strength-bar" id="pwd-bar"></div></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="password2">Repetir contraseña <span class="required">*</span></label>
      <input class="form-control" type="password" id="password2" name="password2" placeholder="Repite la contraseña" autocomplete="new-password" required maxlength="128">
    </div>
    <button type="submit" class="btn btn-primary btn-lg" id="btn-submit" style="width:100%;justify-content:center">
      <span id="btn-text">Guardar nueva contraseña</span>
      <span id="btn-load" style="display:none">Guardando…</span>
    </button>
  </form>

  <div style="text-align:center;margin-top:20px;font-size:.82rem;color:var(--gray-mid)">
    <a href="login.html" style="color:var(--navy);font-weight:600;text-decoration:none">← Volver al inicio de sesión</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
import db from '../js/supabase-client.js';

const errorBanner   = document.getElementById('error-banner');
const successBanner = document.getElementById('success-banner');
const pwdBar        = document.getElementById('pwd-bar');
const form          = document.getElementById('form-reset');

// Ocultar el formulario mientras se verifica el enlace
form.style.display = 'none';

// Detectar parámetros de recuperación en la URL
// - Flujo PKCE (Supabase v2 moderno): ?code=...
// - Flujo implícito (legado):          #access_token=...&type=recovery
const urlParams  = new URLSearchParams(location.search);
const hashParams = new URLSearchParams(location.hash.slice(1));
const hasCode    = urlParams.has('code');
const hasToken   = hashParams.get('type') === 'recovery' && hashParams.has('access_token');

if (!hasCode && !hasToken) {
  // No hay ningún parámetro de recuperación: enlace inválido o acceso directo
  errorBanner.textContent = 'Enlace de recuperación inválido o expirado. Solicita uno nuevo.';
  errorBanner.style.display = 'block';
} else {
  // Esperar el evento PASSWORD_RECOVERY que Supabase emite tras validar el código.
  // Con PKCE, getSession() puede devolver null si el intercambio aún no ha terminado;
  // onAuthStateChange garantiza que recibimos la sesión cuando esté lista.
  db.auth.onAuthStateChange((event, _session) => {
    if (event === 'PASSWORD_RECOVERY') {
      form.style.display = '';
      errorBanner.style.display = 'none';
    }
  });

  // Tiempo máximo de espera: si en 8 s no llega el evento, el enlace está caducado
  setTimeout(() => {
    if (form.style.display === 'none' && errorBanner.style.display === 'none') {
      errorBanner.textContent = 'Enlace de recuperación inválido o expirado. Solicita uno nuevo.';
      errorBanner.style.display = 'block';
    }
  }, 8000);
}

document.getElementById('password').addEventListener('input', (e) => {
  const v = e.target.value;
  let p = 0;
  if (v.length >= 8) p++;
  if (/[A-Z]/.test(v)) p++;
  if (/[0-9]/.test(v)) p++;
  if (/[^A-Za-z0-9]/.test(v)) p++;
  const colores = ['#dc2626','#d97706','#2563eb','#16a34a'];
  pwdBar.style.width = (p * 25) + '%';
  pwdBar.style.background = colores[p - 1] || '#e5e7eb';
});

document.getElementById('form-reset').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBanner.style.display = 'none';

  const pwd  = document.getElementById('password').value;
  const pwd2 = document.getElementById('password2').value;

  if (pwd.length < 8) { errorBanner.textContent = 'La contraseña debe tener al menos 8 caracteres.'; errorBanner.style.display = 'block'; return; }
  if (pwd !== pwd2)   { errorBanner.textContent = 'Las contraseñas no coinciden.'; errorBanner.style.display = 'block'; return; }

  const btn  = document.getElementById('btn-submit');
  const text = document.getElementById('btn-text');
  const load = document.getElementById('btn-load');
  btn.disabled = true; text.style.display = 'none'; load.style.display = '';

  const { error } = await db.auth.updateUser({ password: pwd });

  if (error) {
    errorBanner.textContent = error.message;
    errorBanner.style.display = 'block';
    btn.disabled = false; text.style.display = ''; load.style.display = 'none';
    return;
  }

  document.getElementById('form-reset').style.display = 'none';
  successBanner.style.display = 'block';
});
</script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
