<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — ClasesDe10</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="https://clasesde10.wordpress.com/wp-content/uploads/2025/07/cropped-chatgpt-image-17-jul-2025-20_00_31.png">
<link rel="stylesheet" href="/css/style.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:40px 20px;
       background:linear-gradient(135deg,#0f1f3d 0%,#0d2952 60%,#0e3a5a 100%); }
.error-card { max-width:480px; }
.error-code { font-family:'Playfair Display',serif; font-size:7rem; font-weight:900; color:#e8a030; line-height:1; margin-bottom:8px; }
.error-title { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:16px; }
.error-desc { color:rgba(255,255,255,.7); line-height:1.7; margin-bottom:32px; font-size:1rem; }
.error-btn {
  display:inline-block; background:#e8a030; color:#0f1f3d;
  font-weight:700; padding:14px 32px; border-radius:8px;
  text-decoration:none; font-size:1rem; transition:background .2s;
}
.error-btn:hover { background:#f5c060; }
.error-logo { margin-bottom:32px; }
.error-logo img { width:64px; height:64px; border-radius:14px; object-fit:cover; }
</style>
</head>
<body>
<div class="error-card">
  <div class="error-logo">
    <img src="https://clasesde10.wordpress.com/wp-content/uploads/2025/07/cropped-chatgpt-image-17-jul-2025-20_00_31.png" alt="ClasesDe10">
  </div>
  <div class="error-code">404</div>
  <div class="error-title">Página no encontrada</div>
  <div class="error-desc">La página que buscas no existe o ha sido movida. Vuelve al inicio y encuentra tu profesor particular ideal en Madrid.</div>
  <a href="/" class="error-btn">← Volver al inicio</a>
</div>
</body>
</html>
