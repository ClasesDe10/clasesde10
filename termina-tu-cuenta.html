<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1f3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClasesDe10">
<title>Termina tu cuenta — ClasesDe10</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/img/logo-192.png">
<link rel="stylesheet" href="/css/dashboard.css?v=20260705-panel-pwa-mobile">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: calc(var(--app-vh, 1vh) * 100);
    padding: 20px;
    background: var(--navy);
  }
  .completion-card {
    width: min(100%, 510px);
    padding: 32px;
    border-radius: 2px;
    background: #fff;
    box-shadow: none;
    border-top: 3px solid var(--gold);
  }
  .completion-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .completion-brand img { width: 44px; height: 44px; border-radius: 2px; }
  .completion-brand-name { color: var(--navy); font-family: 'Playfair Display', serif; font-size: 1.35rem; }
  .completion-brand-name span { color: var(--gold); }
  .form-control, .btn { border-radius: 2px; }
  h1 { margin: 0; color: var(--navy); font-family: 'Playfair Display', serif; font-size: clamp(1.65rem, 5vw, 2.15rem); }
  .completion-intro { margin: 8px 0 22px; color: var(--gray-mid); line-height: 1.55; }
  .google-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    padding: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 2px;
    background: #f8fafc;
  }
  .google-profile img,
  .google-avatar-fallback {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    border-radius: 50%;
  }
  .google-profile img { object-fit: cover; }
  .google-profile [hidden] { display: none !important; }
  .google-avatar-fallback { display: grid; place-items: center; color: #fff; background: var(--navy); font-weight: 700; }
  .google-profile strong, .google-profile span { display: block; overflow-wrap: anywhere; }
  .google-profile strong { color: var(--navy); }
  .google-profile span { margin-top: 2px; color: var(--gray-mid); font-size: .82rem; }
  .role-label { display: block; margin-bottom: 9px; color: var(--navy); font-size: .84rem; font-weight: 700; }
  .role-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .role-option { position: relative; padding: 14px; border: 2px solid #e5e7eb; border-radius: 2px; cursor: pointer; }
  .role-option:has(input:checked) { border-color: var(--navy); background: rgba(15, 31, 61, .04); }
  .role-option:has(input:disabled) { cursor: default; opacity: .75; }
  .role-option input { position: absolute; opacity: 0; pointer-events: none; }
  .role-option strong { display: block; color: var(--navy); font-size: .9rem; }
  .role-option span { display: block; margin-top: 3px; color: var(--gray-mid); font-size: .74rem; }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; margin-bottom: 7px; color: var(--navy); font-size: .84rem; font-weight: 700; }
  .form-control { width: 100%; }
  .form-hint { margin-top: 6px; color: var(--gray-mid); font-size: .74rem; line-height: 1.45; }
  .legal-check { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 20px; color: var(--gray-mid); font-size: .78rem; line-height: 1.45; }
  .legal-check input { width: 17px; height: 17px; margin-top: 2px; flex: 0 0 auto; accent-color: var(--navy); }
  .legal-check a { color: var(--navy); font-weight: 600; }
  .completion-actions { display: grid; gap: 9px; }
  .completion-actions .btn { width: 100%; justify-content: center; }
  .error-banner { display: none; margin-bottom: 18px; padding: 11px 13px; border-radius: 2px; color: #991b1b; background: #fee2e2; font-size: .82rem; }
  .loading-state { padding: 28px 0; color: var(--gray-mid); text-align: center; }
  #completion-content[hidden], #completion-form[hidden] { display: none; }
  @media (max-width: 520px) {
    body { align-items: flex-start; padding: 12px; }
    .completion-card { padding: 24px 18px; border-radius: 2px; }
  }
</style>
</head>
<body>
<main class="completion-card">
  <div class="completion-brand">
    <img src="/assets/img/logo-192.png" alt="">
    <div class="completion-brand-name">Clases<span>De10</span></div>
  </div>

  <div id="loading-state" class="loading-state" role="status">Preparando tu cuenta…</div>
  <section id="completion-content" hidden>
    <h1>Termina tu cuenta</h1>
    <p class="completion-intro">Completa los datos necesarios para acceder a tu panel.</p>
    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive"></div>

    <div class="google-profile">
      <img id="google-photo" alt="Foto del perfil de Google" hidden>
      <div id="google-avatar-fallback" class="google-avatar-fallback" aria-hidden="true">G</div>
      <div>
        <strong id="google-name">Cuenta de Google</strong>
        <span id="google-email"></span>
      </div>
    </div>

    <form id="completion-form" novalidate>
      <fieldset id="role-fieldset" style="border:0;padding:0;margin:0">
        <legend class="role-label">¿Cómo usarás ClasesDe10? <span aria-hidden="true">*</span></legend>
        <div class="role-options">
          <label class="role-option">
            <input type="radio" name="role" value="familia" required>
            <strong>Familia</strong>
            <span>Busco profesor</span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="profesor" required>
            <strong>Profesor</strong>
            <span>Quiero dar clases</span>
          </label>
        </div>
      </fieldset>

      <div class="form-group">
        <label class="form-label" for="telefono">Teléfono <span aria-hidden="true">*</span></label>
        <input class="form-control" type="tel" id="telefono" name="telefono" autocomplete="tel" inputmode="tel" maxlength="40" placeholder="600 000 000" required>
        <div class="form-hint">Necesario para contactar contigo y coordinar las clases.</div>
      </div>

      <label class="legal-check" for="accepted-terms">
        <input id="accepted-terms" type="checkbox" required>
        <span>Acepto los <a href="/terminos.html" target="_blank" rel="noopener noreferrer">Términos de uso</a> y la <a href="/privacidad.html" target="_blank" rel="noopener noreferrer">Política de privacidad</a>.</span>
      </label>

      <div class="completion-actions">
        <button type="submit" class="btn btn-gold btn-lg" id="complete-account">
          <span id="complete-account-text">Abrir mi panel</span>
        </button>
        <button type="button" class="btn btn-ghost" id="use-another-account">Usar otra cuenta</button>
      </div>
    </form>
  </section>
</main>

<script type="module">
import {
  completeGoogleAccount,
  getGoogleAccountCompletion,
  logout,
  redirectByRole,
} from '/js/auth-provider.js?v=20260815-onboarding-gate';

const loadingState = document.getElementById('loading-state');
const content = document.getElementById('completion-content');
const form = document.getElementById('completion-form');
const errorBanner = document.getElementById('error-banner');
const roleInputs = [...document.querySelectorAll('input[name="role"]')];
const phoneInput = document.getElementById('telefono');
const submitButton = document.getElementById('complete-account');
const submitText = document.getElementById('complete-account-text');
let accountState = null;

function showError(message) {
  errorBanner.textContent = message;
  errorBanner.style.display = 'block';
  errorBanner.tabIndex = -1;
  errorBanner.focus({ preventScroll: true });
}

function selectedRole() {
  return roleInputs.find((input) => input.checked)?.value || '';
}

function setRole(role, locked = false) {
  roleInputs.forEach((input) => {
    input.checked = input.value === role;
    input.disabled = locked && input.value !== role;
  });
}

async function loadAccount() {
  try {
    const { data, error } = await getGoogleAccountCompletion();
    if (error) {
      loadingState.textContent = error.message;
      setTimeout(() => { window.location.replace('/pages/login.html'); }, 1800);
      return;
    }
    accountState = data;
    if (!data.requiresAccountCompletion) {
      if (!data.role) {
        await logout({ redirect: false });
        window.location.replace('/pages/login.html');
        return;
      }
      redirectByRole(data.role);
      return;
    }

    const queryRole = new URLSearchParams(window.location.search).get('rol');
    const initialRole = data.role || (['familia', 'profesor'].includes(queryRole) ? queryRole : '');
    if (initialRole) setRole(initialRole, Boolean(data.role));
    phoneInput.value = data.telefono || '';
    document.getElementById('google-name').textContent = `${data.nombre || ''} ${data.apellidos || ''}`.trim() || 'Cuenta de Google';
    document.getElementById('google-email').textContent = data.email || '';

    if (data.photoUrl) {
      const image = document.getElementById('google-photo');
      image.src = data.photoUrl;
      image.hidden = false;
      document.getElementById('google-avatar-fallback').hidden = true;
    }

    loadingState.hidden = true;
    content.hidden = false;
  } catch (error) {
    loadingState.textContent = error.message || 'No se pudo preparar la cuenta.';
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBanner.style.display = 'none';
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  submitButton.disabled = true;
  submitButton.setAttribute('aria-busy', 'true');
  submitText.textContent = 'Guardando…';
  const { error, usuario } = await completeGoogleAccount({
    role: selectedRole(),
    telefono: phoneInput.value,
    acceptedTerms: document.getElementById('accepted-terms').checked,
  });

  if (error) {
    showError(error.message);
    submitButton.disabled = false;
    submitButton.removeAttribute('aria-busy');
    submitText.textContent = 'Abrir mi panel';
    return;
  }

  redirectByRole(usuario.rol || accountState?.role || selectedRole());
});

document.getElementById('use-another-account').addEventListener('click', async () => {
  await logout({ redirect: false });
  window.location.replace('/pages/login.html');
});

loadAccount();
</script>
<script src="/js/pwa.js?v=20260705-panel-pwa-mobile" defer></script>
</body>
</html>
