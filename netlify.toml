# Alias de rutas amigables

[[redirects]]
  from = "/dashboard"
  to   = "/pages/login.html"
  status = 302

[[redirects]]
  from = "/entrar"
  to   = "/pages/login.html"
  status = 301

[[redirects]]
  from = "/registro"
  to   = "/pages/registro.html"
  status = 301

# Headers de seguridad globales

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self' https://*.supabase.co https://*.firebaseio.com https://*.firebaseapp.com https://*.googleapis.com https://cdn.jsdelivr.net https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.gstatic.com https://www.googletagmanager.com https://connect.facebook.net https://clarity.ms https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://firebasestorage.googleapis.com https://firebaseinstallations.googleapis.com https://www.google-analytics.com https://region1.google-analytics.com https://*.clarity.ms https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"

# No indexar dashboards

[[headers]]
  for = "/pages/dashboard/*"
  [headers.values]
    Cache-Control  = "no-store, no-cache, must-revalidate"
    X-Robots-Tag   = "noindex, nofollow"

[[headers]]
  for = "/pages/login.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"

[[headers]]
  for = "/pages/registro.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"

[[headers]]
  for = "/pages/reset-password.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"

# Cache de assets estaticos

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Robots-Tag  = "noindex, nofollow"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache moderado para HTML publicas

[[headers]]
  for = "/clases-particulares/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
